<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등 수학 AI 자기주도 학습방 - 로그인 및 가입 신청</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; }
    body {
      margin: 0; padding: 20px;
      background: linear-gradient(135deg, #eff6ff 0%, #e0f2fe 100%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      color: #1e293b;
    }
    .gate-card {
      width: 100%; max-width: 520px; background: #ffffff;
      border-radius: 20px; padding: 32px 28px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      border: 1px solid #dbeafe;
    }
    .gate-header { text-align: center; margin-bottom: 22px; }
    .gate-badge {
      display: inline-block; padding: 5px 12px; background: #dbeafe;
      color: #1d4ed8; border-radius: 999px; font-size: 13px; font-weight: 700;
      margin-bottom: 10px;
    }
    .gate-title { margin: 0; font-size: 24px; color: #1e3a8a; font-weight: 800; }
    .gate-sub { margin: 6px 0 0; font-size: 14px; color: #64748b; }

    .tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      background: #f1f5f9; padding: 6px; border-radius: 12px; margin-bottom: 18px;
    }
    .tab-btn {
      padding: 12px; border: none; border-radius: 8px; background: transparent;
      font-size: 15px; font-weight: 700; color: #64748b; cursor: pointer;
    }
    .tab-btn.active { background: #ffffff; color: #1d4ed8; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

    .msg-box {
      margin-bottom: 18px; padding: 14px 16px; border-radius: 12px;
      font-size: 14px; font-weight: 700; text-align: center; display: none;
      line-height: 1.5;
    }
    .msg-error { display: block; background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .msg-info { display: block; background: #f0fdf4; color: #15803d; border: 2px solid #86efac; }
    .msg-wait { display: block; background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }

    .label { display: block; font-size: 14px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .input {
      width: 100%; padding: 13px 14px; border: 2px solid #cbd5e1;
      border-radius: 12px; font-size: 16px; margin-bottom: 16px; outline: none;
    }
    .input:focus { border-color: #2563eb; background: #f8fafc; }

    .btn-primary {
      width: 100%; padding: 15px; border: none; border-radius: 12px;
      background: #2563eb; color: #ffffff; font-size: 17px; font-weight: 800;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary {
      width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px;
      background: #f8fafc; color: #475569; font-size: 14px; font-weight: 700;
      cursor: pointer; margin-top: 10px;
    }

    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .profile-card {
      padding: 14px; border: 2px solid #bae6fd; background: #f0f9ff;
      border-radius: 14px; text-align: center; cursor: pointer; transition: all 0.15s;
    }
    .profile-card:hover, .profile-card.selected {
      border-color: #0284c7; background: #e0f2fe; transform: translateY(-2px);
    }
    .profile-name { font-size: 17px; font-weight: 800; color: #0369a1; }
    .profile-meta { font-size: 13px; color: #0284c7; margin-top: 4px; font-weight: 700; }
    .status-pill {
      display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 800;
    }
    .pill-pending { background: #fef3c7; color: #b45309; }
    .pill-active { background: #dcfce7; color: #15803d; }

    .consent-box {
      margin: 12px 0 18px; padding: 14px; background: #fffbeb;
      border: 1px solid #fde68a; border-radius: 12px; font-size: 13px; color: #78350f; line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="gate-card">
  <div class="gate-header">
    <div class="gate-badge">☁️ 재미있는 iT · 초등 수학 완전학습</div>
    <h1 class="gate-title">나만의 AI 수학 학습방</h1>
    <p class="gate-sub">이메일로 자녀 프로필을 선택하고 바로 공부를 시작해요!</p>
  </div>

  <div class="tabs">
    <button type="button" id="tab-login" class="tab-btn active" onclick="switchTab('login')">🔑 학생 로그인</button>
    <button type="button" id="tab-signup" class="tab-btn" onclick="switchTab('signup')">📝 신규 가입 신청</button>
  </div>

  <div id="gate-msg" class="msg-box"></div>

  <!-- 1. 로그인 영역 -->
  <div id="view-login">
    <!-- 1단계: 학부모 이메일 (또는 테스터 ID) 입력 - 항상 깨끗한 빈칸으로 시작 -->
    <div id="step-email">
      <label class="label">📧 학부모 이메일 입력 (체험단은 테스터 ID 입력)</label>
      <input type="text" id="login-email" class="input" autocomplete="off" placeholder="예: parent@gmail.com 또는 tester1" onkeydown="if(event.key==='Enter') lookupEmailOrTester()">
      <button type="button" class="btn-primary" id="btn-lookup" onclick="lookupEmailOrTester()">다음 (자녀 프로필 찾기) 👉</button>
    </div>

    <!-- 2단계: 등록된 자녀 카드 선택 및 학년·학기·비밀번호 입력 -->
    <div id="step-profile" style="display:none;">
      <div id="profile-section-title" class="label">👦 공부할 학생 카드를 터치해 주세요</div>
      <div id="profile-list" class="profile-grid"></div>

      <div id="pin-section" style="display:none;">
        <!-- 오늘 공부할 학년·학기 자유 변경 가능 -->
        <div id="login-grade-sem-box" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:4px;">
          <div>
            <label class="label">🎒 공부할 학년</label>
            <select id="login-grade" class="input" style="font-weight:700; color:#1e3a8a;" onchange="onLoginGradeSemChange()">
              <option value="6">초등학교 6학년</option>
              <option value="5">초등학교 5학년</option>
              <option value="4">초등학교 4학년</option>
              <option value="3">초등학교 3학년</option>
              <option value="2">초등학교 2학년</option>
              <option value="1">초등학교 1학년</option>
            </select>
          </div>
          <div>
            <label class="label">📘 공부할 학기</label>
            <select id="login-sem" class="input" style="font-weight:700; color:#1e3a8a;" onchange="onLoginGradeSemChange()">
              <option value="1">1학기</option>
              <option value="2">2학기</option>
            </select>
          </div>
        </div>

        <label class="label" id="pin-label">🔢 비밀번호 4자리 입력</label>
        <input type="password" id="login-pin" maxlength="10" class="input" autocomplete="new-password" placeholder="숫자 4자리 입력" onkeydown="if(event.key==='Enter') submitFinalLogin()">
        <button type="button" class="btn-primary" id="btn-login" onclick="submitFinalLogin()">🚀 수학 공부방 입장하기 👉</button>
      </div>

      <button type="button" class="btn-secondary" onclick="resetToEmailStep()">🔄 처음으로 (다른 이메일 입력)</button>
    </div>
  </div>

  <!-- 2. 신규 가입 신청 영역 (학부모용) -->
  <div id="view-signup" style="display:none;">
    <label class="label">📧 학부모 이메일 (필수 · 다자녀 등록 기준)</label>
    <input type="email" id="reg-email" class="input" autocomplete="off" placeholder="예: parent@gmail.com">

    <label class="label">👦 자녀(학생) 이름 (2글자 이상)</label>
    <input type="text" id="reg-name" class="input" autocomplete="off" placeholder="예: 김민준">

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div>
        <label class="label">🎒 학년</label>
        <select id="reg-grade" class="input" style="font-weight:700; color:#1e3a8a;">
          <option value="6" selected>초등학교 6학년</option>
          <option value="5">초등학교 5학년</option>
          <option value="4">초등학교 4학년</option>
          <option value="3">초등학교 3학년</option>
          <option value="2">초등학교 2학년</option>
          <option value="1">초등학교 1학년</option>
        </select>
      </div>
      <div>
        <label class="label">📘 학기</label>
        <select id="reg-sem" class="input" style="font-weight:700; color:#1e3a8a;">
          <option value="1" selected>1학기</option>
          <option value="2">2학기</option>
        </select>
      </div>
    </div>

    <label class="label">🔢 학습방 비밀번호 설정 (숫자 4자리)</label>
    <input type="password" id="reg-pin" maxlength="4" class="input" autocomplete="new-password" placeholder="예: 1234">

    <div class="consent-box">
      <div style="font-weight:800; margin-bottom:4px;">📋 [필수] 만 14세 미만 아동 개인정보 수집·이용 법정대리인 동의</div>
      <div style="font-size:12px; color:#92400e; margin-bottom:8px;">
        • <b>수집 항목:</b> 학부모 이메일, 자녀 이름, 학년·학기, 암호화된 비밀번호, 학습 진도 기록<br>
        • <b>수집 목적:</b> 학생 계정 식별, 클라우드 학습 기록 연동 및 이용 기간 관리<br>
        • <b>보유 기간:</b> 회원 탈퇴 또는 이용 종료 시 즉시 파기
      </div>
      <label style="display:flex; align-items:center; gap:8px; font-weight:800; cursor:pointer; color:#b45309;">
        <input type="checkbox" id="reg-consent" style="width:18px; height:18px;">
        본인은 법정대리인(학부모)으로서 위 개인정보 수집·이용에 동의합니다.
      </label>
    </div>

    <button type="button" class="btn-primary" id="btn-signup" onclick="submitSignup()">📨 회원가입 승인 신청하기 👉</button>
  </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAIf_-5uMXH4LNGSOdGVgM2PZZ_1-qK7pc",
    authDomain: "math-self-srudy.firebaseapp.com",
    projectId: "math-self-srudy",
    storageBucket: "math-self-srudy.firebasestorage.app",
    messagingSenderId: "27278117022",
    appId: "1:27278117022:web:2e05a51a4a4b1d97e8538f",
    measurementId: "G-53JHN6FH62"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let foundProfiles = [];
  let selectedProfile = null;
  let selectedProfileIdx = -1;

  // 접속 시 기존 자동 이메일 기록을 지우고 항상 깨끗한 첫 화면으로 시작!
  window.addEventListener('DOMContentLoaded', () => {
    localStorage.removeItem('MATH_LAST_EMAIL');
    document.getElementById('login-email').value = '';
    document.getElementById('login-pin').value = '';
  });

  async function sha256Hash(text) {
    const clean = String(text || '').trim() + "_MATH_SALT_2026";
    if (window.crypto && window.crypto.subtle) {
      const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(clean));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    let h = 0;
    for (let i = 0; i < clean.length; i++) h = Math.imul(31, h) + clean.charCodeAt(i) | 0;
    return "fb_" + Math.abs(h).toString(16);
  }

  function showMsg(text, type = 'error') {
    const el = document.getElementById('gate-msg');
    el.className = 'msg-box msg-' + type;
    el.innerHTML = text;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function clearMsg() {
    const el = document.getElementById('gate-msg');
    el.className = 'msg-box';
    el.innerHTML = '';
  }

  function clearSignupForm() {
    document.getElementById('reg-email').value = '';
    document.getElementById('reg-name').value = '';
    document.getElementById('reg-grade').value = '6';
    document.getElementById('reg-sem').value = '1';
    document.getElementById('reg-pin').value = '';
    document.getElementById('reg-consent').checked = false;
  }

  function switchTab(mode, keepMsg = false) {
    if (!keepMsg) clearMsg();
    document.getElementById('tab-login').classList.toggle('active', mode === 'login');
    document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
    document.getElementById('view-login').style.display = mode === 'login' ? 'block' : 'none';
    document.getElementById('view-signup').style.display = mode === 'signup' ? 'block' : 'none';
  }

  // 1단계: 이메일 또는 테스터 ID 조회
  async function lookupEmailOrTester(preserveMsg = false) {
    if (!preserveMsg) clearMsg();
    const rawInput = (document.getElementById('login-email').value || '').trim().toLowerCase();
    if (!rawInput) {
      showMsg("⚠️ 학부모 이메일 주소(또는 테스터 ID)를 입력해 주세요.");
      return;
    }

    const btn = document.getElementById('btn-lookup');
    btn.innerText = "☁️ 계정 확인 중...";

    try {
      // A) 테스터 계정(tester1 ~ tester10 등) 확인
      if (/^tester\d+$/i.test(rawInput)) {
        const tDoc = await db.collection('students').doc(rawInput).get();
        btn.innerText = "다음 (자녀 프로필 찾기) 👉";
        if (!tDoc.exists) {
          showMsg(`⚠️ 등록되지 않은 테스터 ID(${rawInput})입니다.`);
          return;
        }
        const data = tDoc.data();
        foundProfiles = [{ docId: tDoc.id, ...data, isTester: true }];
        renderProfileStep(true, preserveMsg);
        return;
      }

      // B) 학부모 이메일로 등록된 자녀 목록 조회
      const snap = await db.collection('students').where('parentEmail', '==', rawInput).get();
      btn.innerText = "다음 (자녀 프로필 찾기) 👉";

      if (snap.empty) {
        showMsg("⚠️ 해당 이메일로 등록된 학생이 없습니다. [📝 신규 가입 신청] 탭에서 먼저 등록해 주세요!");
        return;
      }

      foundProfiles = [];
      snap.forEach(doc => foundProfiles.push({ docId: doc.id, ...doc.data() }));
      renderProfileStep(false, preserveMsg);
    } catch (e) {
      btn.innerText = "다음 (자녀 프로필 찾기) 👉";
      showMsg("⚠️ 클라우드 조회 중 오류가 발생했습니다: " + e.message);
    }
  }

  function renderProfileStep(isTester, preserveMsg = false) {
    document.getElementById('step-email').style.display = 'none';
    document.getElementById('step-profile').style.display = 'block';
    const listEl = document.getElementById('profile-list');
    const gradeSemBox = document.getElementById('login-grade-sem-box');

    if (isTester) {
      document.getElementById('profile-section-title').innerText = "🧪 시연용 테스터 계정 확인 (전 학년·학기 열람 가능)";
      listEl.innerHTML = '';
      if (gradeSemBox) gradeSemBox.style.display = 'none';
      selectProfile(0, preserveMsg);
      return;
    }

    if (gradeSemBox) gradeSemBox.style.display = 'grid';
    document.getElementById('profile-section-title').innerText = "👦 공부할 학생 카드를 터치해 주세요";
    listEl.innerHTML = foundProfiles.map((p, idx) => {
      const isPending = (p.status === 'pending');
      const statusBadge = isPending
        ? `<div class="status-pill pill-pending">⏳ 승인 대기 중</div>`
        : `<div class="status-pill pill-active">🟢 이용 가능</div>`;
      return `
        <div class="profile-card" id="pcard-${idx}" onclick="selectProfile(${idx}, false)">
          <div class="profile-name">👦 ${p.name}</div>
          <div class="profile-meta" id="pmeta-${idx}">${p.grade || '6'}학년 ${p.semester || '1'}학기</div>
          ${statusBadge}
        </div>
      `;
    }).join('');

    if (foundProfiles.length === 1) {
      selectProfile(0, preserveMsg);
    } else {
      document.getElementById('pin-section').style.display = 'none';
    }
  }

  function selectProfile(idx, preserveMsg = false) {
    if (!preserveMsg) clearMsg();
    selectedProfileIdx = idx;
    selectedProfile = foundProfiles[idx];
    document.querySelectorAll('.profile-card').forEach((el, i) => {
      el.classList.toggle('selected', i === idx);
    });

    // 선택한 학생의 현재 학년·학기를 드롭다운에 반영
    const gSel = document.getElementById('login-grade');
    const sSel = document.getElementById('login-sem');
    if (gSel) gSel.value = String(selectedProfile.grade || '6');
    if (sSel) sSel.value = String(selectedProfile.semester || '1');

    document.getElementById('pin-section').style.display = 'block';
    document.getElementById('pin-label').innerText = `🔢 [${selectedProfile.name}] 학생의 비밀번호 입력`;
    const pinInp = document.getElementById('login-pin');
    pinInp.value = '';
    if (!preserveMsg) pinInp.focus();
  }

  // 드롭다운에서 공부할 학년·학기를 바꾸면 카드 표시와 선택 정보도 즉시 변경!
  function onLoginGradeSemChange() {
    if (!selectedProfile || selectedProfileIdx < 0) return;
    const newG = document.getElementById('login-grade').value;
    const newS = document.getElementById('login-sem').value;
    selectedProfile.grade = newG;
    selectedProfile.semester = newS;
    const metaEl = document.getElementById(`pmeta-${selectedProfileIdx}`);
    if (metaEl) metaEl.innerText = `${newG}학년 ${newS}학기`;
  }

  function resetToEmailStep() {
    clearMsg();
    selectedProfile = null;
    selectedProfileIdx = -1;
    document.getElementById('login-email').value = '';
    document.getElementById('login-pin').value = '';
    document.getElementById('step-profile').style.display = 'none';
    document.getElementById('step-email').style.display = 'block';
    document.getElementById('login-email').focus();
  }

  function getTodayYMD() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // 2단계: 비밀번호 검증 + 선택한 학년·학기로 study.html 입장!
  async function submitFinalLogin() {
    clearMsg();
    if (!selectedProfile) {
      showMsg("⚠️ 먼저 학생 프로필 카드를 선택해 주세요.");
      return;
    }

    const lockInfo = JSON.parse(localStorage.getItem('MATH_PIN_LOCK') || '{}');
    if (lockInfo.until && Date.now() < lockInfo.until) {
      const sec = Math.ceil((lockInfo.until - Date.now()) / 1000);
      showMsg(`⛔ 비밀번호 5회 오류로 잠겼습니다. ${sec}초 후 다시 시도해 주세요.`);
      return;
    }

    const rawPin = (document.getElementById('login-pin').value || '').trim();
    if (!rawPin) {
      showMsg("⚠️ 비밀번호를 입력해 주세요.");
      return;
    }

    // 사용자가 드롭다운에서 선택한 최신 학년·학기 값 읽기
    const chosenGrade = document.getElementById('login-grade') ? document.getElementById('login-grade').value : (selectedProfile.grade || '6');
    const chosenSem = document.getElementById('login-sem') ? document.getElementById('login-sem').value : (selectedProfile.semester || '1');

    // 클라우드 최신 승인 상태 조회
    try {
      const freshDoc = await db.collection('students').doc(selectedProfile.docId).get();
      if (freshDoc.exists) {
        selectedProfile = { docId: freshDoc.id, ...freshDoc.data() };
      }
    } catch (e) {}

    const inputHash = await sha256Hash(rawPin);
    const pinOk = (selectedProfile.pinHash && selectedProfile.pinHash === inputHash) ||
                  (selectedProfile.pin && String(selectedProfile.pin) === rawPin);

    if (!pinOk) {
      const cnt = (lockInfo.count || 0) + 1;
      if (cnt >= 5) {
        localStorage.setItem('MATH_PIN_LOCK', JSON.stringify({ count: 0, until: Date.now() + 300000 }));
      } else {
        localStorage.setItem('MATH_PIN_LOCK', JSON.stringify({ count: cnt }));
      }
      showMsg(`⚠️ 비밀번호가 일치하지 않습니다. (오류 ${cnt}/5회)`);
      return;
    }

    localStorage.removeItem('MATH_PIN_LOCK');

    const status = selectedProfile.status || 'active';
    if (status === 'pending') {
      showMsg("⏳ <b>현재 선생님의 가입 승인 대기 중입니다!</b><br>선생님이 이용 승인을 완료하면 바로 입장할 수 있어요.", 'wait');
      return;
    }
    if (status === 'blocked') {
      showMsg("⛔ <b>이용이 일시 정지된 계정입니다.</b><br>선생님께 문의해 주세요.");
      return;
    }
    if (!selectedProfile.isUnlimited && selectedProfile.expireDate) {
      if (getTodayYMD() > selectedProfile.expireDate) {
        showMsg(`📅 <b>이용 기간(${selectedProfile.expireDate}까지)이 만료되었습니다.</b><br>선생님께 이용 기간 연장을 신청해 주세요!`, 'wait');
        return;
      }
    }

    const isTester = (selectedProfile.accountType === 'tester' || selectedProfile.isTester);

    // 학생이 학년·학기를 변경해서 로그인했다면 클라우드에도 업데이트
    if (!isTester && (selectedProfile.grade !== chosenGrade || selectedProfile.semester !== chosenSem)) {
      try {
        await db.collection('students').doc(selectedProfile.docId).set({
          grade: chosenGrade,
          semester: chosenSem,
          updatedAt: new Date().toLocaleString()
        }, { merge: true });
      } catch (e) {}
    }

    const sessionData = {
      docId: selectedProfile.docId,
      parentEmail: selectedProfile.parentEmail || '',
      name: selectedProfile.name,
      pin: rawPin,
      grade: isTester ? '6' : chosenGrade,
      semester: isTester ? '1' : chosenSem,
      accountType: isTester ? 'tester' : 'student',
      isAllAccess: isTester,
      verifiedAt: Date.now()
    };

    localStorage.setItem('MATH_CURRENT_SESSION', JSON.stringify(sessionData));
    window.location.href = 'study.html';
  }

  // 신규 회원가입 신청 ➔ 완료 시 입력 폼 클리어 후 깨끗한 첫 로그인 화면으로 복귀!
  async function submitSignup() {
    clearMsg();
    const email = (document.getElementById('reg-email').value || '').trim().toLowerCase();
    const name = (document.getElementById('reg-name').value || '').trim();
    const grade = document.getElementById('reg-grade').value;
    const semester = document.getElementById('reg-sem').value;
    const pin = (document.getElementById('reg-pin').value || '').trim();
    const consent = document.getElementById('reg-consent').checked;

    if (!email.includes('@') || !email.includes('.')) {
      showMsg("⚠️ 올바른 학부모 이메일 주소를 입력해 주세요.");
      return;
    }
    if (name.length < 2) {
      showMsg("⚠️ 자녀(학생) 이름을 2글자 이상 입력해 주세요.");
      return;
    }
    if (!/^\d{4}$/.test(pin)) {
      showMsg("⚠️ 비밀번호는 숫자 4자리로 입력해 주세요.");
      return;
    }
    if (!consent) {
      showMsg("⚠️ 만 14세 미만 아동 개인정보 수집·이용에 대한 학부모 동의에 체크해 주세요.");
      return;
    }

    const btn = document.getElementById('btn-signup');
    btn.innerText = "☁️ 가입 신청 중...";

    try {
      const snap = await db.collection('students')
        .where('parentEmail', '==', email)
        .get();

      let isDup = false;
      snap.forEach(doc => {
        if ((doc.data().name || '').trim() === name) isDup = true;
      });

      if (isDup) {
        btn.innerText = "📨 회원가입 승인 신청하기 👉";
        showMsg(`⚠️ [${email}] 아래에 이미 [${name}] 학생이 등록되어 있습니다. [🔑 학생 로그인] 탭을 이용해 주세요!`);
        return;
      }

      const pinHash = await sha256Hash(pin);
      const newDocRef = db.collection('students').doc();

      await newDocRef.set({
        studentId: newDocRef.id,
        accountType: 'student',
        parentEmail: email,
        name: name,
        pinHash: pinHash,
        grade: grade,
        semester: semester,
        status: 'pending',
        isUnlimited: false,
        expireDate: '',
        parentConsent: {
          agreed: true,
          agreedAt: new Date().toLocaleString()
        },
        records: {},
        createdAt: new Date().toLocaleString(),
        updatedAt: new Date().toLocaleString(),
        createdTimestamp: firebase.firestore.FieldValue.serverTimestamp()
      });

      btn.innerText = "📨 회원가입 승인 신청하기 👉";
      clearSignupForm();
      resetToEmailStep();
      switchTab('login', true);
      showMsg(`🎉 <b>[${name}] 학생의 가입 신청이 완료되었습니다!</b><br>선생님이 이용 승인을 완료하면 이메일을 입력해 바로 입장할 수 있어요.`, 'info');

    } catch (e) {
      btn.innerText = "📨 회원가입 승인 신청하기 👉";
      showMsg("⚠️ 가입 신청 저장 중 오류가 발생했습니다: " + e.message);
    }
  }
</script>
