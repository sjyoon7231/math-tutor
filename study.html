<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>초등 수학 AI 자기주도 완전학습</title>
  <!-- Firebase CDN (무설치 클라우드 데이터베이스 연동) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #1e293b;
    }
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px 12px 60px 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 780px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 24px 26px 34px 26px;
      margin: 0 auto;
      overflow: visible;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nav-btn {
      background: #334155;
      color: #ffffff;
      border: 1px solid #475569;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.15s;
    }
    .nav-btn:hover { background: #475569; }
    .badge {
      background: var(--primary);
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 999px;
      font-weight: bold;
      font-size: 14px;
    }
    .cloud-pill {
      background: #0369a1;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }
    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1d4ed8;
      color: #ffffff;
      padding: 5px 10px 5px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
    }
    .logout-mini-btn {
      background: #dc2626;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    .score-pill {
      background: #334155;
      color: #f8fafc;
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
    }
    .api-btn {
      background: #0f766e;
      color: #ffffff;
      border: none;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .breadcrumb {
      font-size: 13px;
      color: #475569;
      background: #f8fafc;
      padding: 9px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      border: 1px solid #e2e8f0;
      font-weight: 600;
    }
    h2 {
      color: #0f172a;
      font-size: 22px;
      margin-top: 4px;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    h3 {
      color: #1e3a8a;
      margin-top: 18px;
      margin-bottom: 10px;
    }
    .goal-box {
      background: #eff6ff;
      border-left: 5px solid var(--primary);
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 15px;
      line-height: 1.6;
      color: #1e3a8a;
    }
    .question-box {
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      padding: 20px;
      font-size: 19px;
      font-weight: bold;
      line-height: 1.65;
      margin-bottom: 18px;
      white-space: pre-line;
      color: #0f172a;
    }
    .video-box {
      position: relative;
      width: 100%;
      max-width: 340px;
      aspect-ratio: 9 / 16;
      margin: 0 auto 14px auto;
      background: #000000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
      border: 3px solid #cbd5e1;
    }
    .video-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .yt-shield-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 58px;
      z-index: 5;
      background: transparent;
    }
    .yt-shield-bottom {
      position: absolute;
      bottom: 42px;
      right: 0;
      width: 110px;
      height: 48px;
      z-index: 5;
      background: transparent;
    }
    .video-notice {
      text-align: center;
      font-size: 14px;
      color: #475569;
      margin-bottom: 16px;
      font-weight: bold;
    }
    .summary-card {
      background: #fffbeb;
      border: 2px solid #f59e0b;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      font-size: 16px;
      line-height: 1.75;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px 20px;
      font-size: 17px;
      font-weight: bold;
      color: #ffffff;
      background: var(--primary);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.15s;
      margin-top: 10px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #475569;
    }
    .btn-secondary:hover { background: #334155; }
    .btn-share {
      background: #0f766e;
    }
    .btn-share:hover { background: #115e59; }
    .choice-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    .choice-btn {
      padding: 16px 18px;
      font-size: 17px;
      font-weight: bold;
      background: #ffffff;
      border: 2px solid #94a3b8;
      border-radius: 14px;
      cursor: pointer;
      text-align: left;
      transition: 0.15s;
      color: #0f172a;
    }
    .choice-btn:hover {
      border-color: var(--primary);
      background: #eff6ff;
    }
    .text-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 17px;
      border: 2px solid #94a3b8;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .fraction-widget {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 16px 0 8px 0;
      padding: 16px;
      background: #f8fafc;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
    }
    .whole-input {
      width: 82px;
      height: 62px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      border: 2px solid #64748b;
      border-radius: 12px;
    }
    .frac-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .frac-input {
      width: 92px;
      height: 52px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      border: 2px solid var(--primary);
      border-radius: 10px;
    }
    .frac-line {
      width: 98px;
      height: 4px;
      background: #0f172a;
      border-radius: 2px;
    }
    .helper-caption {
      text-align: center;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 14px;
    }
    .feedback {
      margin-top: 16px;
      padding: 16px 18px;
      border-radius: 14px;
      font-size: 16px;
      line-height: 1.65;
      display: none;
      white-space: pre-line;
    }
    .feedback.correct {
      display: block;
      background: #dcfce7;
      border: 2px solid #22c55e;
      color: #14532d;
    }
    .feedback.hint {
      display: block;
      background: #fef3c7;
      border: 2px solid #f59e0b;
      color: #78350f;
    }
    .report-card {
      background: #f8fafc;
      border: 2px solid #94a3b8;
      border-radius: 16px;
      padding: 18px 20px;
      line-height: 1.75;
      font-size: 16px;
      margin-bottom: 16px;
      overflow: visible;
    }
    .wrong-note-card {
      background: #fffbeb;
      border: 2px solid #f59e0b;
      border-radius: 16px;
      padding: 18px 20px;
      line-height: 1.75;
      font-size: 16px;
      margin-bottom: 16px;
      overflow: visible;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
    }
    .select-card {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: 0.15s;
    }
    .select-card:hover {
      border-color: var(--primary);
      background: #eff6ff;
    }
    .select-card.locked {
      background: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .card-title { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
    .card-sub { font-size: 13px; color: #64748b; }
    .menu-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      padding: 16px 18px;
      text-align: left;
      cursor: pointer;
      transition: 0.15s;
      gap: 12px;
    }
    .menu-item:hover {
      border-color: var(--primary);
      background: #f8fafc;
    }
    .menu-item.locked {
      background: #f1f5f9;
      color: #94a3b8;
    }
    .menu-title { font-size: 17px; font-weight: bold; color: #0f172a; margin-bottom: 4px; }
    .menu-desc { font-size: 13px; color: #64748b; }
    .menu-arrow { font-size: 14px; font-weight: bold; color: var(--primary); white-space: nowrap; }
    .complete-badge {
      background: #dcfce7;
      color: #166534;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }
    .review-badge {
      background: #fef3c7;
      color: #92400e;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }
    .exam-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-top: 18px;
      padding: 18px 20px;
      border-radius: 16px;
      text-align: left;
      cursor: pointer;
      border: 2px solid #f59e0b;
      background: #fffbeb;
    }
    .exam-banner.locked {
      border-color: #cbd5e1;
      background: #f1f5f9;
      color: #64748b;
    }
    .exam-title { font-size: 17px; font-weight: bold; color: #b45309; margin-bottom: 4px; }
    .exam-sub { font-size: 13px; color: #78350f; }
    .demo-bar {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .btn-reset {
      flex: 1;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 10px;
      border: 1px dashed #94a3b8;
      background: #f8fafc;
      color: #475569;
      cursor: pointer;
    }
    .small-step-box {
      display: none;
      margin-top: 18px;
      padding: 18px;
      background: #eff6ff;
      border: 2px solid #60a5fa;
      border-radius: 16px;
    }
    .small-step-title {
      font-size: 16px;
      font-weight: bold;
      color: #1e40af;
      margin-bottom: 12px;
    }
    .step-item {
      background: #ffffff;
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .step-q { font-size: 15px; font-weight: bold; margin-bottom: 8px; color: #1e293b; }
    .step-input-row { display: flex; gap: 8px; align-items: center; }
    .step-mini-input {
      width: 100px;
      padding: 8px 10px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      border: 2px solid #3b82f6;
      border-radius: 8px;
    }
    .step-mini-btn {
      padding: 8px 14px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .step-mini-msg { margin-top: 6px; font-size: 14px; font-weight: bold; }
    .ai-tutor-box {
      display: none;
      margin-top: 18px;
      padding: 18px;
      background: #f0fdfa;
      border: 2px solid #14b8a6;
      border-radius: 16px;
    }
    .ai-tutor-header {
      font-size: 16px;
      font-weight: bold;
      color: #0f766e;
      margin-bottom: 10px;
    }
    .ai-chat-log {
      max-height: 280px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #99f6e4;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .chat-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      font-size: 15px;
      line-height: 1.55;
    }
    .chat-ai { background: #ccfbf1; color: #134e4a; }
    .chat-user { background: #dbeafe; color: #1e3a8a; text-align: right; }
    .ai-input-row { display: flex; gap: 8px; }
    .ai-input {
      flex: 1;
      padding: 11px 14px;
      border: 2px solid #14b8a6;
      border-radius: 10px;
      font-size: 15px;
    }
    .ai-send-btn {
      padding: 11px 18px;
      background: #0d9488;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .read-sentence-box {
      background: #fef9c3;
      border: 2px solid #eab308;
      border-radius: 16px;
      padding: 22px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      color: #713f12;
      margin-bottom: 18px;
      line-height: 1.6;
    }
    .read-step-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .read-btn {
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 12px;
      border: 2px solid #cbd5e1;
      background: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }
    .read-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #1d4ed8;
      cursor: pointer;
    }
    .read-btn.done {
      background: #dcfce7;
      color: #166534;
      border-color: #22c55e;
    }
    .auth-box {
      max-width: 480px;
      margin: 0 auto;
      background: #f8fafc;
      border: 2px solid #cbd5e1;
      border-radius: 18px;
      padding: 22px;
    }
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    .auth-tab.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }
    .auth-label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
      color: #334155;
    }
    .auth-msg {
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #dc2626;
      text-align: center;
    }
    .cloud-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: #ffffff;
      border-radius: 10px;
      overflow: hidden;
    }
    .cloud-table th, .cloud-table td {
      border: 1px solid #cbd5e1;
      padding: 9px 8px;
      text-align: center;
    }
    .cloud-table th {
      background: #f1f5f9;
      font-weight: bold;
      color: #334155;
    }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 16px;
    }
    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 460px;
      border-radius: 18px;
      padding: 22px;
    }
    /* =========================================================
       📱💻 기기별(스마트폰 · 태블릿 · PC) 자동 화면 최적화 (반응형 CSS)
       ========================================================= */
    
    /* 1. 스마트폰 화면 (가로 767px 이하) */
    @media screen and (max-width: 767px) {
      body {
        padding: 10px 8px !important;
      }
      .gate-card, .app-container, .container, #app-wrapper, .card {
        width: 100% !important;
        max-width: 100% !important;
        padding: 18px 14px !important;
        border-radius: 16px !important;
      }
      /* 좁은 화면에서는 2열 카드를 1열로 큼직하게 배치 */
      .profile-grid, .card-grid, .choice-grid {
        grid-template-columns: 1fr !important;
        gap: 10px !important;
      }
      h1, .gate-title { font-size: 21px !important; }
      h2 { font-size: 18px !important; line-height: 1.4 !important; }
      .question-box {
        font-size: 17px !important;
        padding: 16px 14px !important;
      }
      .btn, .btn-primary, .choice-btn, .menu-item {
        font-size: 16px !important;
        padding: 14px 12px !important;
      }
      /* 상단 배지 및 버튼 줄바꿈 허용 */
      .top-bar, .header-bar {
        flex-wrap: wrap !important;
        gap: 6px !important;
      }
      /* 단계별 시간표가 스마트폰 화면 밖으로 넘치지 않게 처리 */
      .cloud-table {
        display: block !important;
        overflow-x: auto !important;
        white-space: nowrap !important;
        font-size: 13px !important;
      }
    }

    /* 2. 태블릿 및 폴더블폰 펼친 화면 (가로 768px ~ 1024px) */
    @media screen and (min-width: 768px) and (max-width: 1024px) {
      body {
        padding: 24px !important;
      }
      .app-container, .container, #app-wrapper, .card {
        max-width: 840px !important;
        padding: 28px 26px !important;
      }
      .question-box {
        font-size: 19px !important;
      }
    }

    /* 3. PC 모니터 및 Zoom 화면 공유 시 (가로 1025px 이상 대화면) */
    @media screen and (min-width: 1025px) {
      .gate-card {
        max-width: 580px !important;
        padding: 38px 34px !important;
      }
      .app-container, .container, #app-wrapper, .card {
        max-width: 960px !important;
        padding: 36px 40px !important;
      }
      h2 { font-size: 24px !important; }
      .question-box {
        font-size: 21px !important;
        padding: 24px 28px !important;
        line-height: 1.65 !important;
      }
      .goal-box {
        font-size: 16px !important;
        padding: 16px 20px !important;
      }
      .btn, .btn-primary {
        font-size: 18px !important;
        padding: 16px 20px !important;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-bar">
      <div class="header-left">
        <button id="home-btn" class="nav-btn" style="display:none;" onclick="goHomeByRole()">🏠 내 단원 홈</button>
        <button id="unit-btn" class="nav-btn" style="display:none;" onclick="showLessonSelect(state.grade, state.semester, state.unit)">📋 차시 목록</button>
        <span id="step-badge" class="badge">로딩 중...</span>
      </div>
      <div class="header-right">
        <span id="cloud-badge" class="cloud-pill">☁️ 클라우드 확인 중</span>
        <span id="user-badge" class="user-pill" style="display:none;">
          <span id="user-name-label"></span>
          <button type="button" class="logout-mini-btn" onclick="logoutStudent()">로그아웃</button>
        </span>
        <span id="score-board" class="score-pill">준비 완료</span>
        <button id="api-key-btn" class="api-btn" onclick="openApiModal()">⚙️ API 키 설정</button>
      </div>
    </div>

    <div id="breadcrumb" class="breadcrumb">📍 현재 위치: 홈</div>
    <div id="app-content"></div>
  </div>

  <!-- 제미나이 API 키 설정 모달 -->
  <div id="api-modal" class="modal-overlay">
    <div class="modal-card">
